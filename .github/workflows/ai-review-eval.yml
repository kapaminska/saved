name: AI Code Review evals

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - "packages/code-reviewer/**"
      - ".github/workflows/ai-review-eval.yml"

permissions:
  contents: read

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: packages/code-reviewer/package-lock.json

      - name: Install reviewer
        working-directory: packages/code-reviewer
        run: npm ci

      - name: Run promptfoo
        working-directory: packages/code-reviewer
        env:
          CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
          SKIP_GITHUB: "1"
          GITHUB_WORKSPACE: ${{ github.workspace }}
        run: npm run eval
