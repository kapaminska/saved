name: AI Reviewer
description: Run the team's Cursor SDK code-review agent
branding:
  icon: terminal
  color: purple

inputs:
  api-key:
    description: Cursor API key
    required: true
  github-token:
    description: Token used to comment and label the pull request
    required: true
  pr-number:
    description: Pull request number
    required: false
    default: ""
  pr-title:
    description: Pull request title
    required: false
    default: ""
  pr-body:
    description: Pull request body
    required: false
    default: ""
  diff-file:
    description: Absolute path to the git diff file
    required: true
  repo:
    description: owner/name repository slug
    required: true
  model:
    description: Cursor model id
    required: false
    default: composer-2.5

outputs:
  verdict:
    description: pass or fail from the parsed review JSON
    value: ${{ steps.agent.outputs.verdict }}

runs:
  using: composite
  steps:
    - name: Configure node
      uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
        cache-dependency-path: packages/code-reviewer/package-lock.json

    - name: Install reviewer
      shell: bash
      working-directory: packages/code-reviewer
      run: npm ci --omit=dev

    - name: Run agent
      id: agent
      shell: bash
      working-directory: packages/code-reviewer
      env:
        CURSOR_API_KEY: ${{ inputs.api-key }}
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ inputs.repo }}
        PR_NUMBER: ${{ inputs.pr-number }}
        PR_TITLE: ${{ inputs.pr-title }}
        PR_BODY: ${{ inputs.pr-body }}
        CURSOR_MODEL: ${{ inputs.model }}
        DIFF_FILE: ${{ inputs.diff-file }}
      run: npx tsx src/cli.ts --diff-file "$DIFF_FILE"
